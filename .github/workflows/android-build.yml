name: Android Build

# Builds a debug APK on every push to feature/main so we get a compile check and a
# downloadable, installable app file (no Android Studio needed on the owner's PC).

on:
  push:
    branches: [ feature, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the APK as a Release on main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Wire the app to the backend WITHOUT committing secrets: written from GitHub Actions secrets.
      # Set these in the repo: Settings -> Secrets and variables -> Actions:
      #   SUPABASE_FUNCTIONS_URL = https://<your-ref>.functions.supabase.co
      #   APP_BACKEND_KEY        = the same value as backend/.env APP_BACKEND_KEY
      - name: Write backend config from secrets
        env:
          URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          KEY: ${{ secrets.APP_BACKEND_KEY }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf 'SUPABASE_FUNCTIONS_URL=%s\nAPP_BACKEND_KEY=%s\n' "$URL" "$KEY" > app/savelock.properties
            echo "Backend config written — real M-Pesa payments enabled."
          else
            echo "No backend secrets set — building UNCONFIGURED (payments will show a setup message)."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle wrapper (project has none)
        run: gradle wrapper --gradle-version 9.3.1

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: savelock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # On main, publish a stable "latest" Release so the APK is downloadable from the Releases page
      # (https://github.com/wazimuautomate/SaveLock/releases/latest) — no digging in Artifacts.
      - name: Publish APK to Releases (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest app/build/outputs/apk/debug/*.apk \
            --title "SaveLock — latest working build" \
            --notes "Latest SaveLock debug APK from the main branch. Download the .apk below and install it on your phone (allow install from unknown sources)."
