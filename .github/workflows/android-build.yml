name: Android Build

# Builds a debug APK on every push to feature/main so we get a compile check and a
# downloadable, installable app file (no Android Studio needed on the owner's PC).

on:
  push:
    branches: [ feature, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Generate Gradle wrapper (project has none)
        run: gradle wrapper --gradle-version 9.1.0

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: savelock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
